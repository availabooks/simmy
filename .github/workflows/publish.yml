# Tag a release (git tag v0.1.1 && git push --tags) to publish to npm, which jsDelivr then serves.
# Publishes through npm trusted publishing (OIDC), so there is no NPM_TOKEN. Configure it once on
# npmjs.com: package settings > Trusted Publisher > GitHub Actions (availabooks/simmy, publish.yml).
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
