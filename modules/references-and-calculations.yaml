# The References and Calculations Practice assignment from the Excel Educator add-in
# (Prometheus, Section 2-1 Practice; module 0000114 in ee-data): the sheet it builds,
# the task list, what Do it writes, and a local version of its rubric.
version: 1

workbook:
  name: References and Calculations
  sheet: Referencing Cells

assignment:
  title: References and Calculations Practice
  section: Assessment Section 1
  text: >-
    Peter's Pool Palace is having an end of season pool sale. All pools and pool supplies are on
    sale for 30% off. You have decided it is time to buy a pool. The pool and supplies you need and
    the regular prices for these items are listed in the table on the "Referencing Cells" worksheet.
    Finish the table by completing each of the tasks. Reuse as many formulas as possible by copying
    and pasting the formulas that can repeat across rows or columns. Be careful to use appropriate
    relative and absolute cell references. You will notice that "Subtotal" is calculated for you.

sheet:
  rows: 40
  columns: 20
  columnWidth: 64
  # The add-in's setup uses [20, 120, 75, 60, 60] points for A:E; these are narrower
  # so the table fits beside the task pane.
  widths: { A: 12, B: 74, C: 54, D: 80, E: 80 }
  start: D6
  cells:
    B2: Discount
    C2: 0.3
    B3: Tax Rate
    C3: 0.067515
    B5: Item
    C5: Price
    D5: Discount
    E5: Sale Price
    B6: Pool
    C6: 350.99
    B7: Filter
    C7: 75.67
    B8: Chlorine
    C8: 31.25
    B9: Test Kit
    C9: 9.99
    B10: Pool Cover
    C10: 52.35
    B11: Skimmer
    C11: 9.75
    B12: Vacuum
    C12: 13.25
    D14: Subtotal
    E14: =SUM(E6:E12)
    D15: Sales Tax
    D16: Total
  styles:
    - { range: C2:C3, format: 0.00% }
    - { range: D6:E12 C13 B14 E14:E16, format: accounting }
    - { range: C6:C12, align: center }
    - { range: B2:B3 B5:E5 D14:D16, fill: "#800000", color: "#ffffff", bold: true }
    - { range: D6:E12 E14:E16, fill: "#f0e68c", lined: true }
  outlines:
    - { range: D6:E12 E14:E16, weight: 1, color: "#a6a6a6" }

tasks:
  - id: A
    name: Discount
    text: Calculate the "Discount" in cell D6.
    details:
      - Multiply the regular price in cell C6 by the store discount in cell C$2 (notice the use of relative and absolute cell references).
      - Copy your formula in cell D6 and paste it in cells D7 through D12.
    hint: D6
    points: 25
    range: D6:D12
    solution: =C6*$C$2
    rules:
      - { kind: value, points: 5, message: The value in cell D6 is not correct, cell: D6, formula: =C6*$C$2 }
      - { kind: reference, points: 5, message: The formula in cell D6 does not reference C2, cell: D6, ref: C2 }
      - { kind: reference, points: 5, message: The formula in cell D6 does not reference C6, cell: D6, ref: C6 }
      - kind: reference
        points: 5
        message: The formula in cell D6 does not contain an absolute reference to cell C2
        cell: D6
        ref: C2
        forms: [C$2, $C$2]
      - { kind: copied, points: 5, message: The formulas in range D6:D12 are not reused, range: D6:D12 }

  - id: B
    name: Sale Price
    text: Calculate the sale price in cell E6.
    details:
      - Subtract the discount in cell D6 from the regular price in cell C6.
      - Copy your formula in cell E6 and paste it in cells E7 through E12.
    hint: E6
    points: 25
    range: E6:E12
    solution: =C6-D6
    rules:
      - { kind: value, points: 9, message: The value in cell E6 is not correct, cell: E6, formula: =C6-D6 }
      - { kind: reference, points: 4, message: The formula in cell E6 does not reference C6, cell: E6, ref: C6 }
      - { kind: reference, points: 4, message: The formula in cell E6 does not reference D6, cell: E6, ref: D6 }
      - { kind: copied, points: 8, message: The formulas in range E6:E12 are not reused, range: E6:E12 }

  - id: C
    name: Sales Tax
    text: Calculate the sales tax in cell E15.
    details:
      - Multiply the subtotal in cell E14 by the sales tax rate in cell C3.
    hint: E15
    points: 25
    range: E15
    solution: =E14*C3
    rules:
      - { kind: value, points: 9, message: The value in cell E15 is not correct, cell: E15, formula: =E14*C3 }
      - { kind: reference, points: 8, message: The formula in cell E15 does not reference E14, cell: E15, ref: E14 }
      - { kind: reference, points: 8, message: The formula in cell E15 does not reference C3, cell: E15, ref: C3 }

  - id: D
    name: Total Price
    text: Calculate the total in cell E16.
    details:
      - Add the sales tax in cell E15 to the subtotal in cell E14.
      - Reference the appropriate cells as part of your calculations.
    hint: E16
    points: 25
    range: E16
    solution: =E14+E15
    rules:
      - { kind: value, points: 15, message: The value in cell E16 is not correct, cell: E16, formula: =E14+E15 }
      - { kind: reference, points: 5, message: The formula in cell E16 does not reference E14, cell: E16, ref: E14 }
      - { kind: reference, points: 5, message: The formula in cell E16 does not reference E15, cell: E16, ref: E15 }

note:
  title: Try it
  steps:
    - Click a task in the Excel Educator pane to jump to its cell.
    - In D6, type =C6*C$2 and press Enter. The $ keeps C2 fixed when the formula is copied.
    - Drag the small square on D6's corner down to D12.
    - Click the wand to have a task done for you. Click it again to undo it.
    - Press Next, then Submit Now to see your grade.

# Each line is its own clip. The clip loads when that line starts, and the cursor fits the action into it.
autopilot:
  - audio: /modules/narration/1.mp3
    transcript: Peter's Pool Palace is having an end-of-season pool sale. All pools and pool supplies are 30% off, and you have decided to buy a pool.
  - audio: /modules/narration/2.mp3
    transcript: The items you need and their regular prices are listed on the Referencing Cells worksheet. Subtotal is already calculated. Finish the table, and copy any formula that can repeat, using relative and absolute references.
  - { audio: /modules/narration/3.mp3, at: C2, transcript: "The store discount is 30%, in cell C2. The sales tax rate is in cell C3." }
  - { task: A, audio: /modules/narration/4.mp3, transcript: Calculate the Discount in cell D6. }
  - { task: A, type: =C6*C$2, at: D6, done: false, audio: /modules/narration/5.mp3, transcript: "Multiply the regular price in cell C6 by the store discount in cell C$2. The dollar sign keeps C2 fixed when the formula is copied." }
  - { task: A, at: D6, fill: D6:D12, audio: /modules/narration/6.mp3, transcript: Copy the formula in cell D6 and paste it into cells D7 through D12. }
  - { task: B, audio: /modules/narration/7.mp3, transcript: Calculate the sale price in cell E6. }
  - { task: B, type: =C6-D6, at: E6, done: false, audio: /modules/narration/8.mp3, transcript: Subtract the discount in cell D6 from the regular price in cell C6. }
  - { task: B, at: E6, fill: E6:E12, audio: /modules/narration/9.mp3, transcript: Copy the formula in cell E6 and paste it into cells E7 through E12. }
  - { task: C, audio: /modules/narration/10.mp3, transcript: Calculate the sales tax in cell E15. }
  - { task: C, type: =E14*C3, at: E15, audio: /modules/narration/11.mp3, transcript: Multiply the subtotal in cell E14 by the sales tax rate in cell C3. }
  - { task: D, audio: /modules/narration/12.mp3, transcript: Calculate the total in cell E16. }
  - { task: D, type: =E14+E15, at: E16, audio: /modules/narration/13.mp3, transcript: Add the sales tax in cell E15 to the subtotal in cell E14. }
  - { task: A, audio: /modules/narration/14.mp3, transcript: Click a task in the Excel Educator pane to jump to its cell. }
  - { task: B, doit: true, undo: true, done: false, audio: /modules/narration/15.mp3, transcript: "Click the wand to have a task done for you. Click it again to undo it." }
  - { submit: true, audio: /modules/narration/16.mp3, transcript: "Press Next, then Submit Now to see your grade." }

poster:
  range: B5:E9
